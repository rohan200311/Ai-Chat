name: Build and Release APK

on:
  push:
    branches: [ main, arena/* ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (default v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: List APKs
        run: |
          echo "=== app/build/outputs ==="
          find app/build/outputs -name "*.apk" -type f -exec ls -lh {} \; || true
          echo "=== root ==="
          ls -lh *.apk || true
          ls -lh dist/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiChat-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            *.apk
            dist/*.apk

      - name: Upload APK to Release v1.0.0 (Assets section)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || 'v1.0.0' }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            AiChat-debug.apk
            AiChat.apk
            dist/AiChat-debug.apk
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
