name: Build APK
on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || echo "no gradlew, generating wrapper"
      - name: Generate Gradle Wrapper if missing
        if: hashFiles('gradlew') == ''
        run: |
          gradle wrapper --gradle-version 8.10.2 || true
      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --info || gradle :app:assembleDebug
      - name: Build Release APK (unsigned)
        run: |
          ./gradlew :app:assembleRelease || gradle :app:assembleRelease
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AiChat-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
